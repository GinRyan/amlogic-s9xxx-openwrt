# SPDX-License-Identifier: GPL-2.0
#============================================================================================
# Board specific packaging hooks: Orange Pi 3B (rockchip / rk3566) with the
# Unisoc UWE5622 (AW859A) Wi-Fi + Bluetooth combo (board revision v1.1).
#
# This file is sourced by [ remake ] while the image is packaged (see the
# "adjust_kernel_files" hook at the end of replace_kernel()) and it is also
# shipped inside the image as /etc/openwrt-board-release.conf.
#
# It does two things, both of which have to happen *after* the prebuilt ophub
# kernel has been unpacked into the image:
#
#   1. Apply the uwe5622 device tree overlay to the prebuilt board dtb
#      (/boot/dtb/rockchip/rk3566-orangepi-3b*.dtb).  The kernel dtb knows the
#      SDIO host (&sdmmc1) but not the "uwe-bsp" node the driver is looking for.
#
#   2. Install the uwe5622 kernel modules that were built for this exact kernel
#      release into /lib/modules/<release>/extra and refresh modules.dep.
#      Generate them first with make-openwrt/uwe5622/build-kmods.sh.
#
# Documentation: make-openwrt/uwe5622/README.md
#============================================================================================

write_board_file="no"
adjust_kernel_files="yes"

uwe5622_path="${resource_path}/uwe5622"
uwe5622_dtb_names="rk3566-orangepi-3b.dtb rk3566-orangepi-3b-v1.1.dtb"

# Apply the DT overlay to every board dtb that exists in the boot partition.
uwe5622_patch_dtb() {
    local dtb_dir="${tag_bootfs}/dtb/${PLATFORM}"
    local overlay_source="${uwe5622_path}/dts/orangepi-3b-uwe5622-overlay.dts"
    local dts_name dtb_file work_dir

    [[ -f "${overlay_source}" ]] || error_msg "uwe5622: overlay source [ ${overlay_source} ] is missing."
    [[ -d "${dtb_dir}" ]] || error_msg "uwe5622: dtb directory [ ${dtb_dir} ] is missing."
    command -v dtc >/dev/null 2>&1 && command -v fdtoverlay >/dev/null 2>&1 ||
        error_msg "uwe5622: [ dtc ] and [ fdtoverlay ] are required (package: device-tree-compiler)."

    work_dir="$(mktemp -d)"
    [[ -n "${work_dir}" ]] || error_msg "uwe5622: cannot create a temporary directory."

    echo -e "${INFO} uwe5622: compiling the Orange Pi 3B device tree overlay."
    dtc -@ -I dts -O dtb -o "${work_dir}/uwe5622.dtbo" "${overlay_source}" ||
        error_msg "uwe5622: failed to compile [ ${overlay_source} ]."

    for dts_name in ${uwe5622_dtb_names}; do
        dtb_file="${dtb_dir}/${dts_name}"
        [[ -f "${dtb_file}" ]] || continue

        if grep -q "uwe-bsp" "${dtb_file}" 2>/dev/null; then
            echo -e "${INFO} uwe5622: [ ${dts_name} ] already contains the uwe-bsp node, skipping."
            continue
        fi

        echo -e "${INFO} uwe5622: patching [ ${dts_name} ] with the uwe-bsp/sprd-mtty nodes."
        fdtoverlay -i "${dtb_file}" -o "${work_dir}/patched.dtb" "${work_dir}/uwe5622.dtbo" ||
            error_msg "uwe5622: fdtoverlay failed for [ ${dtb_file} ]."

        # Make sure the merge really produced what the driver expects.
        dtc -I dtb -O dts "${work_dir}/patched.dtb" 2>/dev/null | grep -q "uwe-bsp" ||
            error_msg "uwe5622: [ ${dts_name} ] has no uwe-bsp node after the overlay was applied."

        cat "${work_dir}/patched.dtb" >"${dtb_file}" ||
            error_msg "uwe5622: failed to write [ ${dtb_file} ]."
        echo -e "${SUCCESS} uwe5622: [ ${dts_name} ] patched."
    done

    rm -rf "${work_dir}"
}

# Install the prebuilt modules (built by build-kmods.sh for this kernel release).
uwe5622_install_kmods() {
    local kmods_dir="${uwe5622_path}/kmods/${kernel_name}"
    local modules_dir="${tag_rootfs}/lib/modules/${kernel_name}"
    local ko_file

    if [[ ! -d "${kmods_dir}" ]]; then
        if [[ "${uwe5622_allow_missing_kmods:-no}" == "yes" ]]; then
            echo -e "${WARNING} uwe5622: no modules for kernel [ ${kernel_name} ] in [ ${kmods_dir} ]."
            echo -e "${WARNING} uwe5622: Wi-Fi will not work in this image."
            return 0
        fi
        error_msg "uwe5622: no modules for kernel [ ${kernel_name} ] in [ ${kmods_dir} ].
        Build them with: make-openwrt/uwe5622/build-kmods.sh -v ${kernel%%-*} -n ${kernel_name}
        or set uwe5622_allow_missing_kmods=yes to package the image without Wi-Fi."
    fi
    [[ -d "${modules_dir}" ]] || error_msg "uwe5622: [ ${modules_dir} ] is missing."

    mkdir -p "${modules_dir}/extra"
    for ko_file in "${kmods_dir}"/*.ko; do
        [[ -f "${ko_file}" ]] || continue
        cp -f "${ko_file}" "${modules_dir}/extra/" ||
            error_msg "uwe5622: failed to install [ ${ko_file} ]."
    done

    echo -e "${INFO} uwe5622: installed modules for [ ${kernel_name} ]:"
    ls -1 "${modules_dir}/extra/"

    command -v depmod >/dev/null 2>&1 ||
        error_msg "uwe5622: [ depmod ] is required to refresh modules.dep (package: kmod)."

    # The kernel package flattens every module into the release directory with
    # symlinks.  Remove them while depmod runs (otherwise the same module shows
    # up twice) and restore the same layout afterwards.
    find "${modules_dir}" -maxdepth 1 -type l -name '*.ko' -delete
    depmod -b "${tag_rootfs}" "${kernel_name}" ||
        error_msg "uwe5622: depmod failed for [ ${kernel_name} ]."
    (cd "${modules_dir}" && find . -mindepth 2 -type f -name '*.ko' -exec ln -sf {} ./ \;)

    echo -e "${INFO} uwe5622: module dependencies:"
    grep -E "(uwe5622_bsp_sdio|sprdwl_ng|sprdbt_tty)\.ko:" "${modules_dir}/modules.dep" || true

    # CFG80211 is a module in the ophub kernels; without it sprdwl_ng cannot load.
    grep -q "sprdwl_ng\.ko:.*cfg80211" "${modules_dir}/modules.dep" ||
        echo -e "${WARNING} uwe5622: [ sprdwl_ng ] does not depend on cfg80211 in modules.dep."
}

adjust_kernel_files_cmd() {
    uwe5622_patch_dtb
    uwe5622_install_kmods
}
